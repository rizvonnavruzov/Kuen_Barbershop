<!DOCTYPE html>
<html lang="tg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панели усто | Kuen Barbershop</title>
    <link rel="stylesheet" href="barber.css">
    <style>
        body { padding-top: 50px; }
        .admin-container { max-width: 1000px; margin: 0 auto; padding: 20px; }
        .booking-table { width: 100%; border-collapse: collapse; margin-top: 30px; }
        .booking-table th, .booking-table td { padding: 15px; text-align: left; border-bottom: 1px solid var(--glass-border); }
        .status-badge { padding: 5px 10px; border-radius: 5px; font-size: 0.8rem; font-weight: bold; }
        .status-pending { background: #f1c40f; color: black; }
        .status-confirmed { background: #2ecc71; color: white; }
        .status-rejected { background: #e74c3c; color: white; }
        .actions { display: flex; gap: 10px; }
        .btn-small { padding: 8px 12px; font-size: 0.8rem; border-radius: 5px; cursor: pointer; border: none; }
        .btn-approve { background: #2ecc71; color: white; }
        .btn-reject { background: #e74c3c; color: white; }
    </style>
</head>
<body data-i18n-title="meta.adminTitle">
    <div class="admin-container">
        <div class="admin-header">
            <div>
                <h1 style="color: var(--primary-color);" data-i18n="admin.title">Панели усто</h1>
                <p data-i18n="admin.subtitle">Дархостҳои сабт ва пардохтҳои Алифро дар ин ҷо санҷед.</p>
            </div>
            <div class="lang-switch" role="group" aria-label="Забон" data-i18n-aria="lang.group">
                <button type="button" data-lang="tg" class="active" aria-pressed="true">Тоҷикӣ</button>
                <button type="button" data-lang="ru" aria-pressed="false">Русский</button>
                <button type="button" data-lang="en" aria-pressed="false">English</button>
            </div>
        </div>

        <table class="booking-table">
            <thead>
                <tr>
                    <th data-i18n="admin.customer">Мизоҷ</th>
                    <th data-i18n="admin.service">Хизмат</th>
                    <th data-i18n="admin.datetime">Сана ва вақт</th>
                    <th data-i18n="admin.bank">Бонк</th>
                    <th data-i18n="admin.status">Ҳолат</th>
                    <th data-i18n="admin.actions">Амалҳо</th>
                </tr>
            </thead>
            <tbody id="admin-table-body">
                <!-- Dynamic -->
            </tbody>
        </table>
    </div>

    <script src="i18n.js"></script>
    <script>
        let adminPassword = sessionStorage.getItem('adminPassword');

        function statusLabel(status) {
            const key = { pending: 'admin.pending', confirmed: 'admin.confirmed', rejected: 'admin.rejected' }[status];
            return key ? t(key) : status;
        }

        function checkAuth() {
            if (!adminPassword) {
                adminPassword = prompt(t('admin.passwordPrompt'));
                if (adminPassword) {
                    sessionStorage.setItem('adminPassword', adminPassword);
                }
            }
        }

        function loadBookings() {
            if (!adminPassword) return checkAuth();

            fetch('/api/admin/bookings', {
                headers: { 'x-admin-password': adminPassword }
            })
            .then(res => {
                if (res.status === 401) {
                    alert(t('admin.invalidPassword'));
                    sessionStorage.removeItem('adminPassword');
                    adminPassword = null;
                    location.reload();
                    return [];
                }
                return res.json();
            })
            .then(bookings => {
                const body = document.getElementById('admin-table-body');
                if (!body) return;
                body.innerHTML = '';
                bookings.reverse().forEach(b => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>
                            <strong>${b.name}</strong><br>
                            <small>${b.phone}</small>
                        </td>
                        <td>${serviceLabel(b.service)}</td>
                        <td>${b.date} ${t('admin.at')} ${b.time}</td>
                        <td>${b.bank.toUpperCase()}</td>
                        <td><span class="status-badge status-${b.status}">${statusLabel(b.status)}</span></td>
                        <td class="actions">
                            ${b.status === 'pending' ? `
                                <button onclick="updateStatus('${b.id}', 'confirmed')" class="btn-small btn-approve">${t('admin.confirm')}</button>
                                <button onclick="updateStatus('${b.id}', 'rejected')" class="btn-small btn-reject">${t('admin.reject')}</button>
                            ` : '-'}
                        </td>
                    `;
                    body.appendChild(tr);
                });
            })
            .catch(err => console.error("Error loading bookings:", err));
        }

        function updateStatus(id, status) {
            fetch('/api/admin/update-status', {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'x-admin-password': adminPassword
                },
                body: JSON.stringify({ id, status })
            }).then(res => {
                if (res.status === 401) {
                    alert(t('admin.session'));
                    location.reload();
                } else {
                    loadBookings();
                }
            });
        }

        checkAuth();
        loadBookings();
        setInterval(loadBookings, 8000); // Refresh every 8s
        document.addEventListener('languagechange', loadBookings);
    </script>
</body>
</html>
